[book]
title = "Protocol Canary"
description = "Documentation for Protocol Canary, the Stellar protocol compatibility checker"
authors = ["Stellar Canary Contributors"]
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/Stellar-drive/stellar-drive-stellar-drive-protocol-canary"
edit-url-template = "https://github.com/Stellar-drive/stellar-drive-stellar-drive-protocol-canary/edit/main/docs-site/src/{path}"
site-url = "/stellar-drive-stellar-drive-protocol-canary/"
default-theme = "light"
preferred-dark-theme = "navy"

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true

[output.html.fold]
enable = true
level = 1
